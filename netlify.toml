[build]
  command = "npm run build"
  publish = "dist"

# Halaman yang sudah di-prerender dilayani langsung.
# URL lain jatuh ke 404.html yang juga hasil prerender.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
